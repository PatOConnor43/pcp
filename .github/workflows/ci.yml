name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go mod tidy
        run: go mod tidy -diff
      # Runs go vet, gofmt, staticcheck and others; see .golangci.yml.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            flags: -race
          - os: macos-latest
            flags: -race
          # -race needs cgo and a C toolchain; skip it on Windows.
          - os: windows-latest
            flags: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ${{ matrix.flags }} ./...
