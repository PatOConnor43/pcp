version: 2

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - examples/*

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

homebrew_casks:
  - name: pcp
    description: Local reverse proxy that injects credentials so LLM agents can call APIs without handling secrets
    homepage: https://github.com/PatOConnor43/pcp
    license: MIT
    repository:
      owner: PatOConnor43
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    hooks:
      post:
        # Release binaries aren't notarized; clear the quarantine flag so
        # Gatekeeper doesn't block them.
        #
        # This generates a `postflight` block, which Homebrew 7 deprecated in
        # favor of `postflight_steps` (brew warns on install). Switch to the
        # step-based hooks once GoReleaser v2.19 ships them:
        # https://github.com/goreleaser/goreleaser/issues/6870
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/pcp"]
          end
