version: "2"

linters:
  # standard: errcheck, govet, ineffassign, staticcheck, unused
  default: standard
  enable:
    - bodyclose
    - misspell
    - nilerr
    - unconvert
  settings:
    errcheck:
      exclude-functions:
        # Writes to stdout/stderr; nothing useful to do on failure.
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (*text/tabwriter.Writer).Flush
  exclusions:
    presets:
      - std-error-handling
    rules:
      # Test helpers write to httptest servers and temp dirs; failures surface
      # as assertion errors.
      - path: _test\.go
        linters: [errcheck]

formatters:
  enable:
    - gofmt
